name: Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GRADLE_VERSION: "8.14.6"
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify toolchain and pinned build versions
        run: |
          gradle --version | grep -q "Gradle ${GRADLE_VERSION}"
          java -version 2>&1 | grep -q "${JAVA_VERSION}\."
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'minSdk = 35' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'com.android.application.*8.13.2' build.gradle.kts
          grep -q 'org.jetbrains.kotlin.android.*2.4.21' build.gradle.kts
          grep -q 'org.jetbrains.kotlin.plugin.compose.*2.4.21' build.gradle.kts
          grep -q 'android.enableR8.fullMode=true' gradle.properties
          grep -q 'isMinifyEnabled = true' app/build.gradle.kts
          grep -q 'isShrinkResources = true' app/build.gradle.kts
          grep -q 'isCrunchPngs = true' app/build.gradle.kts
          grep -q 'isDebuggable = false' app/build.gradle.kts
          grep -q 'abiFilters += "arm64-v8a"' app/build.gradle.kts
          grep -q 'localeFilters.addAll("ru")' app/build.gradle.kts

      - name: Prepare signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing one of GitHub secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Verify release APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          test -s app/build/outputs/mapping/release/mapping.txt
          ABIS=$(unzip -l "$APK" | awk '$4 ~ /^lib\/[^/]+\/.+/ {split($4, a, "/"); print a[2]}' | sort -u)
          if [ -n "$ABIS" ] && [ "$ABIS" != "arm64-v8a" ]; then
            echo "Unexpected ABI found in APK: $ABIS"
            exit 1
          fi
          if [ -n "$ABIS" ]; then
            echo "Native ABI: $ABIS"
            unzip -l "$APK" | grep "lib/"
          else
            echo "No native libraries packaged (pure Kotlin build)"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: minimal-phone-release-arm64-v8a
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --title "$GITHUB_REF_NAME" \
              --notes "$GITHUB_REF_NAME (arm64-v8a)"
          fi
